<main id="main">
  <section class="flow">
    <div class="shell">
      <div class="auth">
        <svg class="star" viewBox="0 0 100 100" aria-hidden="true"><use href="#star8"/></svg>
        <h1 class="auth__title">會員登入</h1>
        <p class="auth__sub">歡迎回到 Gothel's Garden，登入以查看你的會員中心。</p>

        <form class="auth__form" id="loginForm" novalidate>
          <div class="field">
            <label for="email">電子信箱</label>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="password">密碼</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="請輸入密碼" required>
          </div>
          <p class="auth__err" id="loginErr" role="alert"></p>
          <button class="btn btn--primary btn--full" type="submit">登入</button>
        </form>

        <div class="auth__demo">
          <p class="auth__demo-title">示範帳號（點擊即可自動填入）</p>
          <div class="auth__demo-list" id="demoList"></div>
        </div>

        <p class="auth__foot">還不是會員？<a href="#">立即註冊</a></p>
      </div>
    </div>
  </section>
