<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>後台登入｜Gothel's Garden</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
      media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"></noscript>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<svg class="svg-defs" aria-hidden="true" focusable="false"><defs>
  <polygon id="star8" points="50,0 54.21,39.84 71.92,28.08 60.16,45.79 100,50 60.16,54.21 71.92,71.92 54.21,60.16 50,100 45.79,60.16 28.08,71.92 39.84,54.21 0,50 39.84,45.79 28.08,28.08 45.79,39.84"/>
</defs></svg>

<div class="admin-login">
  <div class="auth">
    <svg class="star" viewBox="0 0 100 100" aria-hidden="true"><use href="#star8"/></svg>
    <p class="admin-login__brand">Gothel's Garden</p>
    <h1 class="auth__title">後台管理系統</h1>
    <p class="auth__sub">請以管理員帳號登入。此為店家營運後台，與前台會員登入分開。</p>

    <form class="auth__form" id="adminLoginForm" novalidate>
      <div class="field">
        <label for="email">管理員帳號</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="admin@example.com" required>
      </div>
      <div class="field">
        <label for="password">密碼</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="請輸入密碼" required>
      </div>
      <p class="auth__err" id="loginErr" role="alert"></p>
      <button class="btn btn--primary btn--full" type="submit">登入後台</button>
    </form>

    <div class="auth__demo">
      <p class="auth__demo-title">示範管理員帳號（點擊自動填入）</p>
      <div class="auth__demo-list">
        <button class="auth__demo-item" type="button" id="demoFill">
          <span class="auth__demo-label">店長 · Amy</span>
          <span class="auth__demo-cred">admin@gg.com　/　admin123</span>
        </button>
      </div>
    </div>

    <p class="auth__foot"><a href="index.html">← 返回前台網站</a></p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/store.js"></script>
<script src="assets/js/admin-store.js"></script>
<script src="assets/js/admin-login.js"></script>
</body>
</html>
